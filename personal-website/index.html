<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adi - Designer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/auth.js"></script>
</head>
<body>
  <nav>
    <a href="index.html" class="logo" aria-label="Adi Fine home">
      <img src="images/Adi-Fine-Logo.webp" alt="Adi Fine logo">
    </a>
    <ul>
      <li><a href="pages/about.html">About</a></li>
      <li><a href="pages/work.html">Work</a></li>
      <li><a href="pages/contact.html">Contact</a></li>
    </ul>
  </nav>

  <section class="hero" id="home">
    <canvas id="dandelion-canvas"></canvas>
    <div class="hero-content">
      <div class="hero-copy">
        <h1>Adi Fine</h1>
        <p>User experience designer dedicated to creating useful and enjoyable environments, both in the digital and built worlds.</p>
        <div class="cta-buttons">
          <a href="pages/work.html" class="btn btn-primary">View My Work</a>
          <a href="pages/contact.html" class="btn btn-secondary">Get in Touch</a>
        </div>
      </div>
      <div class="hero-weather">
        <section class="weather-card is-loading" id="weather-card" aria-live="polite">
          <div class="weather-card-header">
            <span class="weather-card-label">Current Weather</span>
            <h2 id="weather-location">Your location</h2>
          </div>
          <div class="weather-temp">
            <strong id="weather-temperature">--&deg;F</strong>
          </div>
          <p class="weather-condition"><span class="weather-emoji" id="weather-emoji" aria-hidden="true">&#x231B;</span><span id="weather-condition">Loading current conditions...</span></p>
          <p class="weather-meta" id="weather-meta"></p>
          <p class="weather-status" id="weather-status"></p>
        </section>
      </div>
    </div>
  </section>

  <footer>
    <p>&copy; 2026 Adi. All rights reserved.</p>
  </footer>

  <script src="js/app.js" defer></script>
</body>
</html>
