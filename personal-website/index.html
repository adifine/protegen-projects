<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adi - Designer</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .hero-content {
      width: min(1120px, 100%);
      max-width: none;
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(250px, 340px);
      align-items: center;
      gap: 2.5rem;
      text-align: left;
    }

    .hero-copy {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .hero-copy p {
      max-width: 34rem;
    }

    .hero-copy .cta-buttons {
      justify-content: flex-start;
    }

    .weather-card {
      width: min(100%, 320px);
      margin: 0 0 0 auto;
      padding: 0.95rem 1rem;
      border-radius: 18px;
      border: 1px solid rgba(21, 94, 117, 0.14);
      background: rgba(255, 253, 248, 0.82);
      box-shadow: 0 14px 30px rgba(21, 94, 117, 0.1);
      backdrop-filter: blur(12px);
      text-align: left;
    }

    .weather-card-header {
      display: block;
      margin-bottom: 0.6rem;
    }

    .weather-card-label {
      display: block;
      margin-bottom: 0.15rem;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #53707f;
    }

    .weather-temp {
      display: flex;
      align-items: baseline;
      gap: 0.4rem;
      margin-bottom: 0.3rem;
    }

    .weather-temp strong {
      font-family: 'Fraunces', serif;
      font-size: clamp(1.45rem, 3vw, 2rem);
      color: var(--ocean-deep);
    }

    .weather-condition {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      margin: 0;
      font-size: 0.88rem;
      font-weight: 700;
      color: #325160;
    }

    .weather-emoji {
      flex-shrink: 0;
      font-size: 1rem;
      line-height: 1;
      filter: drop-shadow(0 4px 8px rgba(231, 111, 81, 0.16));
    }

    .weather-meta,
    .weather-status {
      margin: 0.45rem 0 0;
      font-size: 12px;
      line-height: 1.45;
      color: var(--muted);
    }

    .weather-status {
      min-height: 1.35em;
    }

    .weather-card.is-loading .weather-temp,
    .weather-card.is-loading .weather-condition,
    .weather-card.is-loading .weather-meta {
      opacity: 0.55;
    }

    @media (max-width: 760px) {
      .hero-content {
        grid-template-columns: 1fr;
        text-align: center;
        gap: 1.8rem;
      }

      .hero-copy {
        align-items: center;
      }

      .hero-copy p {
        max-width: 100%;
      }

      .hero-copy .cta-buttons {
        justify-content: center;
      }

      .weather-card {
        margin: 0 auto;
        width: min(100%, 300px);
        padding: 0.95rem 1rem;
      }

      .weather-card-header {
        margin-bottom: 0.55rem;
      }

      .weather-card h2 {
        font-size: 0.95rem;
      }

      .weather-emoji {
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>
  <nav>
    <a href="index.html" class="logo">Adi Fine</a>
    <ul>
      <li><a href="pages/about.html">About</a></li>
      <li><a href="pages/work.html">Work</a></li>
      <li><a href="pages/contact.html">Contact</a></li>
    </ul>
  </nav>

  <section class="hero" id="home">
    <canvas id="dandelion-canvas"></canvas>
    <div class="hero-content">
      <div class="hero-copy">
        <h1>Adi Fine</h1>
        <p>User Experience Designer.</p>
        <div class="cta-buttons">
          <a href="pages/work.html" class="btn btn-primary">View My Work</a>
          <a href="pages/contact.html" class="btn btn-secondary">Get in Touch</a>
        </div>
      </div>
      <section class="weather-card is-loading" id="weather-card" aria-live="polite">
        <div class="weather-card-header">
          <div>
            <span class="weather-card-label">Local Weather</span>
            <h2 id="weather-location">Checking your location</h2>
          </div>
        </div>
        <div class="weather-temp">
          <strong id="weather-temperature">--&deg;F</strong>
        </div>
        <p class="weather-condition"><span class="weather-emoji" id="weather-emoji" aria-hidden="true">&#x231B;</span><span id="weather-condition">Loading current conditions...</span></p>
        <p class="weather-meta" id="weather-meta">Using your browser location to fetch the latest forecast.</p>
        <p class="weather-status" id="weather-status"></p>
      </section>
    </div>
  </section>

  <footer>
    <p>&copy; 2026 Adi. All rights reserved.</p>
  </footer>

  <script>
  (function () {
    const weatherCard = document.getElementById('weather-card');
    const weatherLocation = document.getElementById('weather-location');
    const weatherEmoji = document.getElementById('weather-emoji');
    const weatherTemperature = document.getElementById('weather-temperature');
    const weatherCondition = document.getElementById('weather-condition');
    const weatherMeta = document.getElementById('weather-meta');
    const weatherStatus = document.getElementById('weather-status');

    function describeWeather(code) {
      if (code === 0) return { emoji: '☀️', label: 'Clear sky' };
      if (code === 1) return { emoji: '🌤️', label: 'Mostly sunny' };
      if (code === 2) return { emoji: '⛅', label: 'Partly cloudy' };
      if (code === 3) return { emoji: '☁️', label: 'Overcast' };
      if (code === 45 || code === 48) return { emoji: '🌫️', label: 'Foggy' };
      if ([51, 53, 55, 56, 57].includes(code)) return { emoji: '🌦️', label: 'Drizzle' };
      if ([61, 63, 65, 80, 81, 82].includes(code)) return { emoji: '🌧️', label: 'Rain' };
      if ([66, 67].includes(code)) return { emoji: '🧊', label: 'Freezing rain' };
      if ([71, 73, 75, 77, 85, 86].includes(code)) return { emoji: '❄️', label: 'Snow' };
      if ([95, 96, 99].includes(code)) return { emoji: '⛈️', label: 'Thunderstorm' };
      return { emoji: '🌤️', label: 'Current conditions' };
    }

    function setWeatherState(state) {
      weatherLocation.textContent = state.location;
      weatherEmoji.textContent = state.emoji;
      weatherTemperature.textContent = state.temperature;
      weatherCondition.textContent = state.condition;
      weatherMeta.textContent = state.meta;
      weatherStatus.textContent = state.status || '';
      weatherCard.classList.toggle('is-loading', Boolean(state.loading));
    }

    async function loadLocationName(latitude, longitude) {
      const geocodeUrl = new URL('https://geocoding-api.open-meteo.com/v1/reverse');
      geocodeUrl.search = new URLSearchParams({
        latitude: String(latitude),
        longitude: String(longitude),
        language: 'en',
        format: 'json'
      }).toString();

      const response = await fetch(geocodeUrl);
      if (!response.ok) {
        throw new Error('Location lookup failed.');
      }

      const data = await response.json();
      const result = data && Array.isArray(data.results) ? data.results[0] : null;
      if (!result) {
        throw new Error('Location lookup returned no results.');
      }

      const city = result.city || result.name || result.locality || result.postcode || 'Your area';
      const state = result.admin1 || result.state || result.country_code || '';
      return state ? `${city}, ${state}` : city;
    }

    async function loadWeather(position) {
      const latitude = position.coords.latitude;
      const longitude = position.coords.longitude;
      const weatherUrl = new URL('https://api.open-meteo.com/v1/forecast');
      weatherUrl.search = new URLSearchParams({
        latitude: String(latitude),
        longitude: String(longitude),
        current: 'temperature_2m,weather_code',
        temperature_unit: 'fahrenheit'
      }).toString();

      const response = await fetch(weatherUrl);
      if (!response.ok) {
        throw new Error('Weather request failed.');
      }

      const data = await response.json();
      const current = data.current;
      if (!current || typeof current.temperature_2m !== 'number' || typeof current.weather_code !== 'number') {
        throw new Error('Weather data is unavailable right now.');
      }

      const summary = describeWeather(current.weather_code);
      const roundedTemp = Math.round(current.temperature_2m);
      let locationName = city + ', ' + state;

      try {
        locationName = await loadLocationName(latitude, longitude);
      } catch (error) {
        locationName = city + ', ' + state;
      }

      setWeatherState({
        location: locationName,
        emoji: summary.emoji,
        temperature: `${roundedTemp}°F`,
        condition: summary.label,
        meta: 'Powered by Open-Meteo using your current browser location.',
        status: '',
        loading: false
      });
    }

    function handleWeatherError(message) {
      setWeatherState({
        location: 'Local weather unavailable',
        emoji: '📍',
        temperature: '--°F',
        condition: 'Location permission is needed for live weather.',
        meta: 'Open-Meteo does not need an API key, but your browser location is required.',
        status: message,
        loading: false
      });
    }

    if (!weatherCard || !navigator.geolocation) {
      if (weatherCard) {
        handleWeatherError('Your browser does not support location-based weather on this page.');
      }
      return;
    }

    navigator.geolocation.getCurrentPosition(
      function (position) {
        loadWeather(position).catch(function () {
          handleWeatherError('Unable to fetch the current forecast right now.');
        });
      },
      function (error) {
        const denied = error && error.code === error.PERMISSION_DENIED;
        handleWeatherError(denied
          ? 'Location access was denied. Allow it to see your local forecast.'
          : 'Your location could not be determined.');
      },
      { enableHighAccuracy: false, timeout: 10000, maximumAge: 300000 }
    );

    const canvas = document.getElementById('dandelion-canvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let W = 0, H = 0;

    function resize() {
      W = canvas.width = canvas.offsetWidth;
      H = canvas.height = canvas.offsetHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    /* draw one dandelion */
    function drawDandelion(cx, cy, r, alpha) {
      if (alpha <= 0) return;
      ctx.save();
      ctx.globalAlpha = alpha;

      // Stem
      ctx.beginPath();
      ctx.moveTo(cx, cy + r * 0.15);
      ctx.bezierCurveTo(cx - 3, cy + r * 0.8, cx - 6, cy + r * 1.4, cx - 10, cy + r * 2.2);
      ctx.strokeStyle = 'rgba(70, 130, 95, 0.45)';
      ctx.lineWidth = 1.5;
      ctx.lineCap = 'round';
      ctx.stroke();

      // Spokes & seed puffs
      const spokes = 16;
      for (let i = 0; i < spokes; i++) {
        const angle = (i / spokes) * Math.PI * 2 - Math.PI * 0.5;
        const ex = cx + Math.cos(angle) * r;
        const ey = cy + Math.sin(angle) * r;

        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(ex, ey);
        ctx.strokeStyle = 'rgba(100, 165, 135, 0.35)';
        ctx.lineWidth = 0.7;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(ex, ey, 4.5, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(195, 235, 220, 0.58)';
        ctx.fill();

        for (let f = 0; f < 6; f++) {
          const fa = angle + (f / 6) * Math.PI * 2;
          ctx.beginPath();
          ctx.moveTo(ex + Math.cos(fa) * 4.5, ey + Math.sin(fa) * 4.5);
          ctx.lineTo(ex + Math.cos(fa) * 10, ey + Math.sin(fa) * 10);
          ctx.strokeStyle = 'rgba(160, 215, 195, 0.28)';
          ctx.lineWidth = 0.45;
          ctx.stroke();
        }
      }

      // Golden centre
      const g = ctx.createRadialGradient(cx - 1, cy - 1, 1, cx, cy, 7);
      g.addColorStop(0, 'rgba(248, 230, 150, 0.9)');
      g.addColorStop(1, 'rgba(210, 178, 95, 0.6)');
      ctx.beginPath();
      ctx.arc(cx, cy, 6.5, 0, Math.PI * 2);
      ctx.fillStyle = g;
      ctx.fill();

      ctx.restore();
    }

    /* draw one floating seed */
    function drawSeed(x, y, rot, alpha, size) {
      if (alpha <= 0) return;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(x, y);
      ctx.rotate(rot);
      ctx.scale(size, size);

      const L = 26;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, -L);
      ctx.strokeStyle = 'rgba(90, 155, 120, 0.5)';
      ctx.lineWidth = 0.9;
      ctx.lineCap = 'round';
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(0, -L - 5, 6, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(195, 235, 220, 0.44)';
      ctx.fill();

      for (let f = 0; f < 7; f++) {
        const fa = (f / 7) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(Math.cos(fa) * 6, -L - 5 + Math.sin(fa) * 6);
        ctx.lineTo(Math.cos(fa) * 13, -L - 5 + Math.sin(fa) * 13);
        ctx.strokeStyle = 'rgba(165, 215, 198, 0.28)';
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }

      ctx.restore();
    }

    /* Three dandelions — different sizes, periods, vertical lanes, staggered phases */
    const dandelions = [
      { period: 26.7, phaseOff: 0.00, yFrac: 0.38, bobAmp: 22, bobFreq: 0.22, radFrac: 0.062, alpha: 0.52 },
      { period: 21.3, phaseOff: 0.38, yFrac: 0.22, bobAmp: 12, bobFreq: 0.30, radFrac: 0.038, alpha: 0.42 },
      { period: 30.0, phaseOff: 0.70, yFrac: 0.62, bobAmp: 16, bobFreq: 0.17, radFrac: 0.050, alpha: 0.46 },
    ];

    /* Floating seeds — 1.5× faster vx/vy/rv */
    const seeds = Array.from({ length: 11 }, (_, i) => ({
      x: (i / 11),
      y: 0.1 + Math.random() * 0.8,
      vx: 0.000143 + Math.random() * 0.000173,
      vy: (Math.random() - 0.5) * 0.000075,
      rot: Math.random() * Math.PI * 2,
      rv: (Math.random() - 0.5) * 0.0042,
      alpha: 0.18 + Math.random() * 0.22,
      size: 0.6 + Math.random() * 0.55,
    }));

    function frame(ms) {
      const t = ms * 0.001;
      ctx.clearRect(0, 0, W, H);

      // Draw each dandelion
      for (const d of dandelions) {
        const phase = ((t / d.period) + d.phaseOff) % 1;
        const mx = W * (1.12 - phase * 1.28);
        const my = H * d.yFrac + Math.sin(t * d.bobFreq) * d.bobAmp;
        const fadeA = phase < 0.08 ? phase / 0.08 : phase > 0.92 ? (1 - phase) / 0.08 : 1;
        drawDandelion(mx, my, Math.min(W, H) * d.radFrac, fadeA * d.alpha);
      }

      // Floating seeds
      for (const s of seeds) {
        s.x += s.vx;
        s.y += s.vy;
        s.rot += s.rv;
        if (s.x > 1.1) { s.x = -0.06; s.y = 0.1 + Math.random() * 0.8; }
        drawSeed(s.x * W, s.y * H, s.rot, s.alpha, s.size);
      }

      requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);
  }());
  </script>
</body>
</html>
